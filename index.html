<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Noter4 AI</title>
  <link rel="stylesheet" href="noter4.css" />
</head>

<body>
  <div id="app">
    <header>
      <h1>Noter4 AI</h1>
      <select id="model">
        <option value="noter4">Noter4 (Fast)</option>
        <option value="noter4plus">Noter4+ (Deep Mode)</option>
      </select>
    </header>

    <textarea id="prompt" placeholder="Ask Noter4 anything..."></textarea>

    <button id="run">Run</button>

    <div id="output-container">
      <pre id="output"></pre>
    </div>
  </div>

  <script type="module" src="noter4.js"></script>
</body>
</html>
